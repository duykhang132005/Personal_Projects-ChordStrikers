<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="/static/js/offline.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1a120c">
    <title>Offline | ChordStrikers</title>
    <link rel="stylesheet" href="/static/css/offline.css">
</head>
<body>
    <main>
        <h1>You are offline</h1>
        <p>ChordStrikers needs a connection to load chord sheets. Check your network and try again.</p>
        <button type="button" id="offline-retry">Try again</button>
        <section class="saved" id="saved-sheets" hidden>
            <h2>Saved on this device</h2>
            <ul id="saved-list"></ul>
        </section>
    </main>
</body>
</html>
