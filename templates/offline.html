<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1a120c">
    <title>Offline | ChordStrikers</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #1a120c;
            color: #fff;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            text-align: center;
            padding: 1.5rem;
        }
        h1 { color: #e07a1f; margin-bottom: 0.5rem; }
        p { max-width: 28rem; margin: 0.5rem auto 1.5rem; line-height: 1.5; }
        button {
            background: #e07a1f;
            color: #1a120c;
            border: 0;
            border-radius: 0.5rem;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <main>
        <h1>You are offline</h1>
        <p>ChordStrikers needs a connection to load chord sheets. Check your network and try again.</p>
        <button type="button" onclick="window.location.reload()">Try again</button>
    </main>
</body>
</html>
