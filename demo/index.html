                            <span class="fw-bold text-warning">Chordify</span> that highlights what chords to play, but aims to improve such an experience with more interactive features without a pay wall.
                        </p>
                    </div>

                            <span class="fw-bold text-success">Flask</span> with
                            <span class="fw-bold text-secondary">SQLAlchemy</span>.
